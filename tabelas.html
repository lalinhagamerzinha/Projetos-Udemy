<!DOCTYPE html>
<html lang="pt-BR">  
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabelas</title>
    </head>
    <body>
        <h1>Tabelas</h1>
        <p>Esta é uma tabela de exemplo:</p>
        <table border="1" style="border-collapse: collapse; font-family: impact; font-size: 20px;">
            <tr style=" font-family: courier;">
                <th style="background-color: #f1185d;"><h1>Coluna 1</h1></th>
                <th style="background-color: #f1185d;">Coluna 2</th>
                <th style="background-color: #f1185d;">Coluna 3</th>
            </tr>
            <tr>
                <td style="color:#f1185d; background-color: #f491b1; font-family: courier; font-size: 30px;">Linha 1, Coluna 1</td>
                <td style="color:#f1185d; background-color: #f491b1;">Linha 1, Coluna 2</td>
                <td style="color:#f1185d; background-color: #f491b1;">Linha 1, Coluna 3</td>
            </tr>
            <tr>
                <td style="color:black; background-color: #f491b1;">Linha 2, Coluna 1</td>
                <td style="color:black; background-color: #f491b1;">Linha 2, Coluna 2</td>
                <td style="color:black; background-color: #f491b1;">Linha 2, Coluna 3</td>
            </tr>
        </table>
    </body>
</html>
